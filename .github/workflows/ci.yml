name: Agentic QA Lab CI

on:
  push:
    branches: [ master, "feat/*" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=agent --cov=app --cov-report=term-missing

      - name: Run Multi-Layer Verification Demo
        run: |
          python -m agent.verifier_demo

      - name: Run Benchmarking Matrix Suite
        run: |
          python -m agent.benchmark_demo

      - name: Run Artifacts Generator
        run: |
          python scripts/generate_artifacts.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentic-qa-artifacts
          path: |
            DEMO_REPORT.md
